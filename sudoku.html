<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sudoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0a0517;
    --deep: #170b34;
    --mid: #2a1454;
    --panel: #1c0f3f;
    --panel-2: #26134f;
    --gold: #f4cc6a;
    --gold-bright: #ffe29a;
    --gold-deep: #b9862a;
    --teal: #3fd8ae;
    --coral: #ff6f6f;
    --text: #f6f3ff;
    --text-dim: #a99bd6;
    --font-display: 'Cinzel', serif;
    --font-body: 'Manrope', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -8%, var(--mid) 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 100%, rgba(63,216,174,0.08) 0%, transparent 55%),
      linear-gradient(180deg, var(--deep) 0%, var(--void) 100%);
    font-family: var(--font-body);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
    overflow-x: hidden;
    position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 25%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 75% 15%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 45% 65%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1.5px 1.5px at 90% 55%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 25% 80%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 60% 40%, rgba(255,255,255,0.28), transparent);
    animation: twinkle 5s ease-in-out infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.5; } 100% { opacity: 1; } }
  .vignette { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse 80% 70% at 50% 30%, transparent 55%, rgba(5,3,15,0.75) 100%); }

  .stage { width: 100%; max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 16px; }

  .back-link {
    align-self: flex-start;
    color: var(--text-dim); text-decoration: none; font-size: 12.5px; font-weight: 700;
    letter-spacing: 0.5px; display: flex; align-items: center; gap: 6px;
    transition: color 0.15s ease;
  }
  .back-link:hover { color: var(--gold-bright); }

  .title {
    font-family: var(--font-display); font-weight: 800; letter-spacing: 3px;
    font-size: clamp(26px, 5vw, 38px); text-align: center;
    background: linear-gradient(100deg, var(--gold-deep) 0%, var(--gold-bright) 25%, #fffce0 45%, var(--gold-bright) 65%, var(--gold-deep) 100%);
    background-size: 260% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 50px rgba(244,204,106,0.25);
    margin: 0; animation: shimmerTitle 6s ease-in-out infinite;
  }
  @keyframes shimmerTitle { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  .subtitle { color: var(--text-dim); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-top: -10px; font-weight: 600; }

  /* ---------- DIFFICULTY SCREEN ---------- */
  .corner-flourish { position: absolute; width: 20px; height: 20px; pointer-events: none; opacity: 0.7; }
  .corner-flourish.tl { top: 10px; left: 10px; border-top: 2px solid var(--gold); border-left: 2px solid var(--gold); border-radius: 6px 0 0 0; }
  .corner-flourish.tr { top: 10px; right: 10px; border-top: 2px solid var(--gold); border-right: 2px solid var(--gold); border-radius: 0 6px 0 0; }
  .corner-flourish.bl { bottom: 10px; left: 10px; border-bottom: 2px solid var(--gold); border-left: 2px solid var(--gold); border-radius: 0 0 0 6px; }
  .corner-flourish.br { bottom: 10px; right: 10px; border-bottom: 2px solid var(--gold); border-right: 2px solid var(--gold); border-radius: 0 0 6px 0; }

  .diff-card {
    position: relative;
    width: 100%;
    background: linear-gradient(180deg, rgba(38,19,79,0.75), rgba(28,15,63,0.75));
    backdrop-filter: blur(16px);
    border: 1.5px solid rgba(244,204,106,0.3);
    border-radius: 20px;
    padding: 32px 26px;
    text-align: center;
    box-shadow: 0 0 0 1px rgba(244,204,106,0.08), 0 30px 70px rgba(0,0,0,0.5);
    animation: revealPop 0.5s cubic-bezier(.22,1,.36,1) both;
  }
  .diff-card p { color: var(--text-dim); font-size: 14px; line-height: 1.6; margin: 8px 0 24px; }
  .diff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .diff-btn {
    background: linear-gradient(180deg, rgba(42,26,85,0.9), rgba(23,11,52,0.9));
    border: 1.5px solid var(--gold-deep);
    border-radius: 14px; padding: 18px 10px; cursor: pointer;
    color: var(--gold-bright); font-family: var(--font-display); font-weight: 700; font-size: 15px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    display: flex; flex-direction: column; gap: 4px; align-items: center;
  }
  .diff-btn .diff-icon { font-size: 22px; }
  .diff-btn .diff-clues { font-family: var(--font-body); font-size: 10.5px; color: var(--text-dim); font-weight: 600; text-transform: none; letter-spacing: 0.3px; }
  .diff-btn:hover { transform: translateY(-3px); border-color: var(--gold-bright); box-shadow: 0 10px 24px -8px rgba(244,204,106,0.5); }
  .diff-btn.extra { border-color: var(--coral); color: #ffb4b4; }
  .diff-btn.extra:hover { border-color: var(--coral); box-shadow: 0 10px 24px -8px rgba(255,111,111,0.5); }

  /* ---------- LOADING ---------- */
  .loading { color: var(--text-dim); font-size: 13px; letter-spacing: 1px; padding: 40px 0; text-align: center; }

  /* ---------- GAME SCREEN ---------- */
  .game-wrap { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px; }

  .hud-bar {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(180deg, rgba(38,19,79,0.65), rgba(28,15,63,0.65));
    backdrop-filter: blur(12px);
    border: 1.5px solid rgba(244,204,106,0.25);
    border-radius: 14px; padding: 10px 16px;
  }
  .hud-item { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .hud-label { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); font-weight: 700; }
  .hud-value { font-family: var(--font-display); font-size: 17px; color: var(--gold-bright); font-weight: 800; }
  .hud-value.timer { color: var(--teal); font-variant-numeric: tabular-nums; }

  .hint-btn {
    background: linear-gradient(180deg, rgba(42,26,85,0.9), rgba(23,11,52,0.9));
    border: 1.5px solid var(--teal); color: var(--teal);
    border-radius: 12px; padding: 8px 14px; font-family: var(--font-body); font-weight: 700; font-size: 12.5px;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .hint-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px -8px rgba(63,216,174,0.5); }
  .hint-btn:disabled { opacity: 0.3; cursor: default; }

  .board {
    display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr);
    width: min(94vw, 480px); height: min(94vw, 480px);
    background: linear-gradient(180deg, rgba(34,17,81,0.9), rgba(21,10,52,0.9));
    border: 2.5px solid var(--gold-deep);
    border-radius: 14px;
    box-shadow: 0 0 0 1px rgba(244,204,106,0.1), 0 0 60px -12px rgba(244,204,106,0.2), 0 20px 45px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  .cell {
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: clamp(15px, 3.6vw, 20px); font-weight: 700;
    color: var(--text); cursor: pointer; user-select: none;
    border: 0.5px solid rgba(169,155,214,0.15);
    background: transparent;
    transition: background 0.12s ease;
    position: relative;
  }
  .cell:nth-child(3n) { border-right: 2px solid var(--gold-deep); }
  .cell:nth-child(9n+1) { border-left: 2px solid var(--gold-deep); }
  .row-thick-top { border-top: 2px solid var(--gold-deep); }
  .row-thick-bottom { border-bottom: 2px solid var(--gold-deep); }

  .cell.given { color: var(--gold-bright); font-weight: 800; }
  .cell.user-filled { color: var(--teal); }
  .cell.hint-filled { color: var(--gold); }
  .cell.selected { background: rgba(244,204,106,0.22); }
  .cell.peer { background: rgba(244,204,106,0.07); }
  .cell.same-value { background: rgba(63,216,174,0.14); }
  .cell.conflict { color: var(--coral) !important; background: rgba(255,111,111,0.18); animation: conflictPulse 1s ease-in-out infinite; }
  @keyframes conflictPulse { 0%, 100% { background: rgba(255,111,111,0.12); } 50% { background: rgba(255,111,111,0.28); } }

  .numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(94vw, 480px); }
  .numpad-btn {
    background: linear-gradient(180deg, rgba(42,26,85,0.9), rgba(23,11,52,0.9));
    border: 1.5px solid var(--gold-deep);
    border-radius: 10px; padding: 12px 0; cursor: pointer;
    color: var(--gold-bright); font-family: var(--font-display); font-weight: 700; font-size: 16px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .numpad-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 18px -8px rgba(244,204,106,0.5); }
  .numpad-btn.erase { color: var(--coral); border-color: var(--coral); font-size: 13px; }

  .controls-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .ctrl-btn {
    background: transparent; border: 1.5px solid var(--gold-deep); color: var(--gold-bright);
    border-radius: 24px; padding: 10px 20px; font-weight: 700; font-size: 12.5px; cursor: pointer;
    font-family: var(--font-body); transition: all 0.15s ease;
  }
  .ctrl-btn:hover { background: rgba(244,204,106,0.1); border-color: var(--gold-bright); transform: translateY(-2px); }

  /* ---------- WIN OVERLAY ---------- */
  .win-overlay {
    position: fixed; inset: 0; background: rgba(5,3,15,0.85); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; z-index: 700;
    animation: fadeIn 0.4s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .win-card {
    background: linear-gradient(180deg, rgba(38,19,79,0.95), rgba(23,11,52,0.97));
    border: 2px solid var(--gold-deep); border-radius: 22px; padding: 40px 34px;
    text-align: center; max-width: 400px; width: 90%;
    box-shadow: 0 0 60px -10px rgba(244,204,106,0.4), 0 30px 70px rgba(0,0,0,0.6);
    animation: revealPop 0.5s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes revealPop { 0% { opacity:0; transform: scale(0.85) translateY(24px);} 60%{opacity:1; transform: scale(1.02) translateY(-4px);} 100%{opacity:1; transform: scale(1) translateY(0);} }
  .win-icon { font-size: 52px; margin-bottom: 8px; }
  .win-title { font-family: var(--font-display); font-size: 26px; color: var(--gold-bright); font-weight: 800; margin-bottom: 8px; }
  .win-stats { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; line-height: 1.7; }
  .win-stats b { color: var(--teal); font-family: var(--font-display); }

  .confetti-piece { position: fixed; top: -20px; z-index: 800; pointer-events: none; border-radius: 2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: 0.9; } }

  .hidden { display: none !important; }
</style>
</head>

<div class="vignette"></div>

<div class="stage">
  <a class="back-link" href="index.html">← Arcade'e Dön</a>
  <div class="subtitle">SAYI VE MANTIK OYUNU</div>
  <div class="title">Sudoku</div>

  <!-- DIFFICULTY SCREEN -->
  <div class="diff-card" id="diffCard">
    <div class="corner-flourish tl"></div>
    <div class="corner-flourish tr"></div>
    <div class="corner-flourish bl"></div>
    <div class="corner-flourish br"></div>
    <p>Bir zorluk seviyesi seç. Her oyun tamamen rastgele üretilir, aynı bulmacayla iki kez karşılaşmazsın.</p>
    <div class="diff-grid">
      <button class="diff-btn" data-diff="easy"><span class="diff-icon">🟢</span>Basit<span class="diff-clues">~40 ipucu</span></button>
      <button class="diff-btn" data-diff="medium"><span class="diff-icon">🟡</span>Orta<span class="diff-clues">~32 ipucu</span></button>
      <button class="diff-btn" data-diff="hard"><span class="diff-icon">🟠</span>Zor<span class="diff-clues">~26 ipucu</span></button>
      <button class="diff-btn extra" data-diff="extreme"><span class="diff-icon">🔴</span>Extra Zor<span class="diff-clues">~20 ipucu</span></button>
    </div>
  </div>

  <div class="loading hidden" id="loading">✦ Bulmaca oluşturuluyor... ✦</div>

  <!-- GAME SCREEN -->
  <div class="game-wrap hidden" id="gameWrap">
    <div class="hud-bar">
      <div class="hud-item"><span class="hud-label">Zorluk</span><span class="hud-value" id="diffLabel">Basit</span></div>
      <div class="hud-item"><span class="hud-label">Süre</span><span class="hud-value timer" id="timerText">00:00</span></div>
      <button class="hint-btn" id="hintBtn">💡 <span id="hintCount">3</span>/3</button>
    </div>

    <div class="board" id="board"></div>

    <div class="numpad" id="numpad"></div>

    <div class="controls-row">
      <button class="ctrl-btn" id="newGameBtn">🔄 Yeni Oyun</button>
      <button class="ctrl-btn" id="changeDiffBtn">⚙️ Zorluk Değiştir</button>
    </div>
  </div>
</div>

<!-- WIN OVERLAY -->
<div class="win-overlay hidden" id="winOverlay">
  <div class="win-card">
    <div class="win-icon">🏆</div>
    <div class="win-title">Tebrikler!</div>
    <div class="win-stats">
      Bulmacayı <b id="winDiff">Basit</b> zorlukta<br>
      <b id="winTime">00:00</b> sürede tamamladın.<br>
      Kullanılan ipucu: <b id="winHints">0</b>/3
    </div>
    <button class="ctrl-btn" id="winNewGameBtn" style="border-color: var(--gold-bright); padding: 12px 28px;">🔄 Yeni Bulmaca</button>
  </div>
</div>

<script>
// ============ SUDOKU CORE ============
function boxIndex(r, c) { return Math.floor(r / 3) * 3 + Math.floor(c / 3); }
function popcount(x) { let c = 0; while (x) { x &= x - 1; c++; } return c; }
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateFullGrid() {
  const grid = Array.from({ length: 9 }, () => Array(9).fill(0));
  const rows = new Array(9).fill(0), cols = new Array(9).fill(0), boxes = new Array(9).fill(0);

  function backtrack(pos) {
    if (pos === 81) return true;
    const r = Math.floor(pos / 9), c = pos % 9;
    const used = rows[r] | cols[c] | boxes[boxIndex(r, c)];
    let avail = (~used) & 0x1FF;
    const bits = [];
    while (avail) { const bit = avail & (-avail); avail ^= bit; bits.push(bit); }
    shuffle(bits);
    for (const bit of bits) {
      const d = Math.round(Math.log2(bit)) + 1;
      grid[r][c] = d;
      rows[r] |= bit; cols[c] |= bit; boxes[boxIndex(r, c)] |= bit;
      if (backtrack(pos + 1)) return true;
      grid[r][c] = 0;
      rows[r] &= ~bit; cols[c] &= ~bit; boxes[boxIndex(r, c)] &= ~bit;
    }
    return false;
  }
  backtrack(0);
  return grid;
}

function countSolutions(grid, limit) {
  const rows = new Array(9).fill(0), cols = new Array(9).fill(0), boxes = new Array(9).fill(0);
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
    const v = grid[r][c];
    if (v) { const bit = 1 << (v - 1); rows[r] |= bit; cols[c] |= bit; boxes[boxIndex(r, c)] |= bit; }
  }
  let count = 0;

  function backtrack() {
    if (count >= limit) return;
    let bestR = -1, bestC = -1, bestAvail = 0, bestCount = 10;
    for (let r = 0; r < 9 && bestCount > 1; r++) {
      for (let c = 0; c < 9; c++) {
        if (grid[r][c] === 0) {
          const used = rows[r] | cols[c] | boxes[boxIndex(r, c)];
          const avail = (~used) & 0x1FF;
          const cnt = popcount(avail);
          if (cnt === 0) return;
          if (cnt < bestCount) { bestCount = cnt; bestR = r; bestC = c; bestAvail = avail; if (cnt === 1) break; }
        }
      }
    }
    if (bestR === -1) { count++; return; }
    let avail = bestAvail;
    while (avail) {
      const bit = avail & (-avail);
      avail ^= bit;
      const d = Math.round(Math.log2(bit)) + 1;
      grid[bestR][bestC] = d;
      rows[bestR] |= bit; cols[bestC] |= bit; boxes[boxIndex(bestR, bestC)] |= bit;
      backtrack();
      grid[bestR][bestC] = 0;
      rows[bestR] &= ~bit; cols[bestC] &= ~bit; boxes[boxIndex(bestR, bestC)] &= ~bit;
      if (count >= limit) return;
    }
  }
  backtrack();
  return count;
}

function generatePuzzle(fullGrid, targetClues) {
  const grid = fullGrid.map(row => row.slice());
  const positions = [];
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) positions.push([r, c]);
  shuffle(positions);

  let clues = 81;
  for (const [r, c] of positions) {
    if (clues <= targetClues) break;
    const backup = grid[r][c];
    if (backup === 0) continue;
    grid[r][c] = 0;
    const testGrid = grid.map(row => row.slice());
    const solCount = countSolutions(testGrid, 2);
    if (solCount === 1) {
      clues--;
    } else {
      grid[r][c] = backup;
    }
  }
  return grid;
}

const DIFFICULTY_CLUES = { easy: 40, medium: 32, hard: 26, extreme: 20 };
const DIFFICULTY_LABELS = { easy: 'Basit', medium: 'Orta', hard: 'Zor', extreme: 'Extra Zor' };

const UNITS = (function buildUnits() {
  const units = [];
  for (let r = 0; r < 9; r++) units.push(Array.from({ length: 9 }, (_, c) => [r, c]));
  for (let c = 0; c < 9; c++) units.push(Array.from({ length: 9 }, (_, r) => [r, c]));
  for (let br = 0; br < 3; br++) for (let bc = 0; bc < 3; bc++) {
    const cells = [];
    for (let dr = 0; dr < 3; dr++) for (let dc = 0; dc < 3; dc++) cells.push([br * 3 + dr, bc * 3 + dc]);
    units.push(cells);
  }
  return units;
})();

// ============ GAME STATE ============
let solution = null;
let puzzle = null;
let userGrid = null;
let givenMask = null;
let hintMask = null;
let selectedCell = null;
let hintsLeft = 3;
let currentDifficulty = 'easy';
let timerInterval = null;
let secondsElapsed = 0;
let gameWon = false;

const diffCard = document.getElementById('diffCard');
const loading = document.getElementById('loading');
const gameWrap = document.getElementById('gameWrap');
const boardEl = document.getElementById('board');
const numpadEl = document.getElementById('numpad');
const diffLabel = document.getElementById('diffLabel');
const timerText = document.getElementById('timerText');
const hintBtn = document.getElementById('hintBtn');
const hintCount = document.getElementById('hintCount');
const newGameBtn = document.getElementById('newGameBtn');
const changeDiffBtn = document.getElementById('changeDiffBtn');
const winOverlay = document.getElementById('winOverlay');
const winDiff = document.getElementById('winDiff');
const winTime = document.getElementById('winTime');
const winHints = document.getElementById('winHints');
const winNewGameBtn = document.getElementById('winNewGameBtn');

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentDifficulty = btn.dataset.diff;
    startNewGame();
  });
});

function startNewGame() {
  diffCard.classList.add('hidden');
  gameWrap.classList.add('hidden');
  loading.classList.remove('hidden');

  setTimeout(() => {
    solution = generateFullGrid();
    puzzle = generatePuzzle(solution, DIFFICULTY_CLUES[currentDifficulty]);
    userGrid = puzzle.map(row => row.slice());
    givenMask = puzzle.map(row => row.map(v => v !== 0));
    hintMask = Array.from({ length: 9 }, () => Array(9).fill(false));
    selectedCell = null;
    hintsLeft = 3;
    secondsElapsed = 0;
    gameWon = false;

    diffLabel.textContent = DIFFICULTY_LABELS[currentDifficulty];
    hintCount.textContent = hintsLeft;
    hintBtn.disabled = false;
    timerText.textContent = '00:00';

    buildBoard();
    buildNumpad();
    renderBoard();
    checkConflicts();

    loading.classList.add('hidden');
    gameWrap.classList.remove('hidden');

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      secondsElapsed++;
      const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const s = String(secondsElapsed % 60).padStart(2, '0');
      timerText.textContent = `${m}:${s}`;
    }, 1000);
  }, 30);
}

function buildBoard() {
  boardEl.innerHTML = '';
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      if (r % 3 === 0) cell.classList.add('row-thick-top');
      if (r === 8) cell.classList.add('row-thick-bottom');
      cell.addEventListener('click', () => selectCell(r, c));
      boardEl.appendChild(cell);
    }
  }
}

function buildNumpad() {
  numpadEl.innerHTML = '';
  for (let n = 1; n <= 9; n++) {
    const btn = document.createElement('button');
    btn.className = 'numpad-btn';
    btn.textContent = n;
    btn.addEventListener('click', () => inputValue(n));
    numpadEl.appendChild(btn);
  }
  const erase = document.createElement('button');
  erase.className = 'numpad-btn erase';
  erase.textContent = 'Sil';
  erase.addEventListener('click', () => inputValue(0));
  numpadEl.appendChild(erase);
}

function selectCell(r, c) {
  if (gameWon) return;
  selectedCell = [r, c];
  renderBoard();
}

function inputValue(n) {
  if (gameWon || !selectedCell) return;
  const [r, c] = selectedCell;
  if (givenMask[r][c]) return;
  userGrid[r][c] = n;
  hintMask[r][c] = false;
  renderBoard();
  checkConflicts();
  checkWin();
}

document.addEventListener('keydown', (e) => {
  if (gameWon || !selectedCell || gameWrap.classList.contains('hidden')) return;
  if (e.key >= '1' && e.key <= '9') inputValue(parseInt(e.key, 10));
  else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') inputValue(0);
  else if (e.key === 'ArrowUp') moveSelection(-1, 0);
  else if (e.key === 'ArrowDown') moveSelection(1, 0);
  else if (e.key === 'ArrowLeft') moveSelection(0, -1);
  else if (e.key === 'ArrowRight') moveSelection(0, 1);
});

function moveSelection(dr, dc) {
  if (!selectedCell) return;
  let [r, c] = selectedCell;
  r = Math.min(8, Math.max(0, r + dr));
  c = Math.min(8, Math.max(0, c + dc));
  selectedCell = [r, c];
  renderBoard();
}

function renderBoard() {
  const cells = boardEl.children;
  const selVal = selectedCell ? userGrid[selectedCell[0]][selectedCell[1]] : 0;
  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const idx = r * 9 + c;
      const cell = cells[idx];
      const v = userGrid[r][c];
      cell.textContent = v === 0 ? '' : v;
      cell.classList.remove('given', 'user-filled', 'hint-filled', 'selected', 'peer', 'same-value');

      if (givenMask[r][c]) cell.classList.add('given');
      else if (hintMask[r][c]) cell.classList.add('hint-filled');
      else if (v !== 0) cell.classList.add('user-filled');

      if (selectedCell) {
        const [sr, sc] = selectedCell;
        if (sr === r && sc === c) cell.classList.add('selected');
        else if (sr === r || sc === c || boxIndex(sr, sc) === boxIndex(r, c)) cell.classList.add('peer');
        if (selVal !== 0 && v === selVal) cell.classList.add('same-value');
      }
    }
  }
}

function checkConflicts() {
  const conflictSet = new Set();
  UNITS.forEach(unit => {
    const valMap = {};
    unit.forEach(([r, c]) => {
      const v = userGrid[r][c];
      if (v !== 0) { (valMap[v] = valMap[v] || []).push([r, c]); }
    });
    Object.values(valMap).forEach(cellsList => {
      if (cellsList.length > 1) cellsList.forEach(([r, c]) => conflictSet.add(r + ',' + c));
    });
  });
  const cells = boardEl.children;
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
    cells[r * 9 + c].classList.toggle('conflict', conflictSet.has(r + ',' + c));
  }
  return conflictSet;
}

function checkWin() {
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) if (userGrid[r][c] === 0) return;
  const conflicts = checkConflicts();
  if (conflicts.size > 0) return;

  gameWon = true;
  clearInterval(timerInterval);
  winDiff.textContent = DIFFICULTY_LABELS[currentDifficulty];
  winTime.textContent = timerText.textContent;
  winHints.textContent = 3 - hintsLeft;
  winOverlay.classList.remove('hidden');
  spawnConfetti();
}

hintBtn.addEventListener('click', () => {
  if (hintsLeft <= 0 || gameWon) return;
  const emptyCells = [];
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
    if (userGrid[r][c] === 0 || (!givenMask[r][c] && userGrid[r][c] !== solution[r][c])) emptyCells.push([r, c]);
  }
  if (emptyCells.length === 0) return;
  const [r, c] = emptyCells[Math.floor(Math.random() * emptyCells.length)];
  userGrid[r][c] = solution[r][c];
  hintMask[r][c] = true;
  hintsLeft--;
  hintCount.textContent = hintsLeft;
  hintBtn.disabled = hintsLeft <= 0;
  renderBoard();
  checkConflicts();
  checkWin();
});

newGameBtn.addEventListener('click', startNewGame);
changeDiffBtn.addEventListener('click', () => {
  clearInterval(timerInterval);
  gameWrap.classList.add('hidden');
  diffCard.classList.remove('hidden');
});
winNewGameBtn.addEventListener('click', () => {
  winOverlay.classList.add('hidden');
  startNewGame();
});

function spawnConfetti() {
  const colors = ['#f4cc6a', '#ffe29a', '#3fd8ae', '#ff9d9d', '#a99bd6', '#ffffff'];
  const count = 90;
  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 6 + Math.random() * 8;
    piece.style.width = size + 'px';
    piece.style.height = size * 0.4 + 'px';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    const duration = 2.6 + Math.random() * 2;
    piece.style.animationDuration = duration + 's';
    piece.style.animationDelay = (Math.random() * 0.6) + 's';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), (duration + 1) * 1000);
  }
}
</script>
</body>
