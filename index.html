<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oyun Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0a0517;
    --deep: #170b34;
    --mid: #2a1454;
    --panel: #1c0f3f;
    --panel-2: #26134f;
    --gold: #f4cc6a;
    --gold-bright: #ffe29a;
    --gold-deep: #b9862a;
    --teal: #3fd8ae;
    --coral: #ff6f6f;
    --text: #f6f3ff;
    --text-dim: #a99bd6;
    --slot-dim: #423878;
    --font-display: 'Cinzel', serif;
    --font-body: 'Manrope', sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -8%, var(--mid) 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 100%, rgba(63,216,174,0.08) 0%, transparent 55%),
      linear-gradient(180deg, var(--deep) 0%, var(--void) 100%);
    font-family: var(--font-body);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 48px 16px 70px;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 25%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 75% 15%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 45% 65%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1.5px 1.5px at 90% 55%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1px 1px at 25% 80%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1.5px 1.5px at 60% 40%, rgba(255,255,255,0.28), transparent),
      radial-gradient(1px 1px at 35% 10%, rgba(255,255,255,0.35), transparent),
      radial-gradient(1.5px 1.5px at 95% 85%, rgba(255,255,255,0.3), transparent);
    animation: twinkle 5s ease-in-out infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.5; } 100% { opacity: 1; } }

  .vignette {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse 80% 70% at 50% 30%, transparent 55%, rgba(5,3,15,0.75) 100%);
  }

  .stage { width: 100%; max-width: 980px; display: flex; flex-direction: column; align-items: center; gap: 8px; }

  .eyebrow {
    color: var(--text-dim); font-size: 11.5px; letter-spacing: 4px; text-transform: uppercase; font-weight: 700;
  }

  .site-title {
    font-family: var(--font-display);
    font-weight: 800;
    letter-spacing: 3px;
    font-size: clamp(32px, 5.5vw, 52px);
    text-align: center;
    background: linear-gradient(100deg, var(--gold-deep) 0%, var(--gold-bright) 25%, #fffce0 45%, var(--gold-bright) 65%, var(--gold-deep) 100%);
    background-size: 260% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 60px rgba(244,204,106,0.3);
    margin: 2px 0 6px;
    animation: shimmerTitle 6s ease-in-out infinite;
  }
  @keyframes shimmerTitle { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

  .site-sub {
    color: var(--text-dim); font-size: 14.5px; text-align: center; max-width: 480px; line-height: 1.6; margin-bottom: 30px;
  }

  .status-bar {
    display: flex; gap: 22px; margin-bottom: 34px; font-size: 12.5px; color: var(--text-dim); font-weight: 700; letter-spacing: 0.5px;
  }
  .status-bar span b { color: var(--gold-bright); font-family: var(--font-display); font-size: 15px; margin-right: 4px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    width: 100%;
  }
  @media (max-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

  .slot {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 12px 10px;
    text-decoration: none;
    overflow: hidden;
  }

  /* Filled / active slot */
  .slot.filled {
    background: linear-gradient(180deg, rgba(38,19,79,0.85), rgba(23,11,52,0.9));
    backdrop-filter: blur(10px);
    border: 1.5px solid var(--gold-deep);
    box-shadow: 0 0 0 1px rgba(244,204,106,0.08), 0 0 40px -10px rgba(244,204,106,0.35), 0 14px 30px rgba(0,0,0,0.5);
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    animation: slotGlow 3s ease-in-out infinite;
  }
  .slot.filled:hover {
    transform: translateY(-4px) scale(1.03);
    border-color: var(--gold-bright);
    box-shadow: 0 0 0 1px rgba(244,204,106,0.2), 0 0 60px -8px rgba(244,204,106,0.55), 0 18px 36px rgba(0,0,0,0.55);
  }
  @keyframes slotGlow {
    0%, 100% { box-shadow: 0 0 0 1px rgba(244,204,106,0.08), 0 0 30px -10px rgba(244,204,106,0.28), 0 14px 30px rgba(0,0,0,0.5); }
    50% { box-shadow: 0 0 0 1px rgba(244,204,106,0.14), 0 0 46px -8px rgba(244,204,106,0.45), 0 14px 30px rgba(0,0,0,0.5); }
  }

  .slot-icon { font-size: 34px; margin-bottom: 8px; filter: drop-shadow(0 0 14px rgba(244,204,106,0.5)); }
  .slot-name {
    font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--gold-bright);
    letter-spacing: 0.5px; line-height: 1.25;
  }
  .slot-num {
    position: absolute; top: 8px; left: 10px; font-family: var(--font-display); font-size: 10.5px;
    color: var(--gold-deep); font-weight: 700; letter-spacing: 1px;
  }
  .slot-tag {
    margin-top: 6px; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase;
    color: var(--teal); font-weight: 700;
    background: rgba(63,216,174,0.12); border: 1px solid rgba(63,216,174,0.3);
    border-radius: 20px; padding: 2px 8px;
  }

  /* Empty slot */
  .slot.empty {
    background: linear-gradient(180deg, rgba(28,15,63,0.4), rgba(15,8,35,0.5));
    border: 1.5px dashed var(--slot-dim);
    color: var(--slot-dim);
  }
  .slot.empty .slot-icon { font-size: 26px; opacity: 0.5; filter: none; margin-bottom: 8px; }
  .slot.empty .slot-name { font-family: var(--font-body); font-weight: 700; font-size: 11px; color: var(--slot-dim); letter-spacing: 1px; text-transform: uppercase; }
  .slot.empty .slot-num { color: var(--slot-dim); opacity: 0.7; }

  footer {
    margin-top: 44px; color: var(--slot-dim); font-size: 11.5px; text-align: center; letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="vignette"></div>

<div class="stage">
  <div class="eyebrow">TARAYICI OYUNLARI KOLEKSİYONU</div>
  <div class="site-title">Oyun Arcade</div>
  <div class="site-sub">Buradan tüm oyunlara tek yerden ulaşabilirsin. Her yeni oyun bir sonraki boş slota eklenecek.</div>

  <div class="status-bar">
    <span><b>5</b>Yayında</span>
    <span><b>11</b>Yakında</span>
  </div>

  <div class="grid" id="grid"></div>

  <footer>Yeni oyunlar geldikçe bu sayfa güncellenecek.</footer>
</div>

<script>
  const SLOTS = [
    { name: "Bilgi Yarışması", icon: "🧠", href: "bilgi-yarismasi.html", tag: "Yayında", filled: true },
    { name: "Sudoku", icon: "🔢", href: "sudoku.html", tag: "Yayında", filled: true },
    { name: "Mayın Tarlası", icon: "💣", href: "mayin-tarlasi.html", tag: "Yayında", filled: true },
    { name: "Solitaire", icon: "🃏", href: "solitaire.html", tag: "Yayında", filled: true },
    { name: "Yıldız Cephesi", icon: "🛸", href: "yildiz-cephesi.html", tag: "Yayında", filled: true }
  ];

  const grid = document.getElementById('grid');
  for (let i = 0; i < 16; i++) {
    const slotData = SLOTS[i];
    const num = String(i + 1).padStart(2, '0');

    if (slotData) {
      const a = document.createElement('a');
      a.className = 'slot filled';
      a.href = slotData.href;
      a.innerHTML = `
        <span class="slot-num">${num}</span>
        <span class="slot-icon">${slotData.icon}</span>
        <span class="slot-name">${slotData.name}</span>
        <span class="slot-tag">${slotData.tag}</span>
      `;
      grid.appendChild(a);
    } else {
      const div = document.createElement('div');
      div.className = 'slot empty';
      div.innerHTML = `
        <span class="slot-num">${num}</span>
        <span class="slot-icon">🔒</span>
        <span class="slot-name">Yakında</span>
      `;
      grid.appendChild(div);
    }
  }
</script>
</body>
</html>
