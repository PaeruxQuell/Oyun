<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Çengel Bulmaca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0a0517; --deep: #170b34; --mid: #2a1454; --panel: #1c0f3f; --panel-2: #26134f;
    --gold: #f4cc6a; --gold-bright: #ffe29a; --gold-deep: #b9862a;
    --teal: #3fd8ae; --coral: #ff6f6f; --text: #f6f3ff; --text-dim: #a99bd6;
    --font-display: 'Cinzel', serif; --font-body: 'Manrope', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -8%, var(--mid) 0%, transparent 60%),
      radial-gradient(ellipse 700px 500px at 90% 100%, rgba(63,216,174,0.08) 0%, transparent 55%),
      linear-gradient(180deg, var(--deep) 0%, var(--void) 100%);
    font-family: var(--font-body); color: var(--text);
    display: flex; justify-content: center; padding: 24px 14px 60px; overflow-x: hidden; position: relative;
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 25%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 75% 15%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 45% 65%, rgba(255,255,255,0.45), transparent),
      radial-gradient(1.5px 1.5px at 90% 55%, rgba(255,255,255,0.3), transparent);
    animation: twinkle 5s ease-in-out infinite alternate;
  }
  @keyframes twinkle { 0% { opacity: 0.5; } 100% { opacity: 1; } }
  .vignette { position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(ellipse 80% 70% at 50% 30%, transparent 55%, rgba(5,3,15,0.75) 100%); }

  .stage { width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: center; gap: 16px; }

  .back-link { align-self: flex-start; color: var(--text-dim); text-decoration: none; font-size: 12.5px; font-weight: 700; }
  .back-link:hover { color: var(--gold-bright); }

  .title {
    font-family: var(--font-display); font-weight: 800; letter-spacing: 3px;
    font-size: clamp(26px, 5vw, 38px); text-align: center;
    background: linear-gradient(100deg, var(--gold-deep) 0%, var(--gold-bright) 25%, #fffce0 45%, var(--gold-bright) 65%, var(--gold-deep) 100%);
    background-size: 260% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 50px rgba(244,204,106,0.25); margin: 0; animation: shimmerTitle 6s ease-in-out infinite;
  }
  @keyframes shimmerTitle { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
  .subtitle { color: var(--text-dim); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; margin-top: -10px; font-weight: 600; }

  .hud-bar {
    width: 100%; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
    background: linear-gradient(180deg, rgba(38,19,79,0.65), rgba(28,15,63,0.65));
    backdrop-filter: blur(12px); border: 1.5px solid rgba(244,204,106,0.25);
    border-radius: 14px; padding: 10px 16px;
  }
  .hud-item { display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .hud-label { font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-dim); font-weight: 700; }
  .hud-value { font-family: var(--font-display); font-size: 16px; color: var(--gold-bright); font-weight: 800; }
  .hud-value.timer { color: var(--teal); font-variant-numeric: tabular-nums; }

  .hint-btn {
    background: linear-gradient(180deg, rgba(42,26,85,0.9), rgba(23,11,52,0.9));
    border: 1.5px solid var(--teal); color: var(--teal);
    border-radius: 12px; padding: 8px 14px; font-family: var(--font-body); font-weight: 700; font-size: 12.5px;
    cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .hint-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px -8px rgba(63,216,174,0.5); }
  .hint-btn:disabled { opacity: 0.3; cursor: default; }

  .board-wrap {
    width: 100%; overflow-x: auto;
    background: linear-gradient(180deg, rgba(34,17,81,0.85), rgba(21,10,52,0.85));
    border: 2px solid var(--gold-deep); border-radius: 16px; padding: 14px;
    box-shadow: 0 0 0 1px rgba(244,204,106,0.1), 0 0 50px -10px rgba(244,204,106,0.2), 0 20px 45px rgba(0,0,0,0.5);
  }
  .board { display: grid; gap: 2px; width: fit-content; margin: 0 auto; }

  .cell {
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; position: relative;
  }
  @media (max-width: 480px) { .cell { width: 34px; height: 34px; } }

  .cell.block { background: transparent; }
  .cell.clue {
    background: linear-gradient(180deg, #201050, #140a30);
    border: 1px solid #3d2c74;
    font-size: 8px; line-height: 1.15; color: var(--gold-bright); font-weight: 700;
    padding: 2px; text-align: center; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  @media (max-width: 480px) { .cell.clue { font-size: 6.5px; } }
  .cell.clue .arrow { font-size: 12px; color: var(--teal); line-height: 1; }

  .cell.letter {
    background: linear-gradient(180deg, #241454, #170b34);
    border: 1.5px solid var(--gold-deep);
    font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--text);
    cursor: pointer;
  }
  @media (max-width: 480px) { .cell.letter { font-size: 14px; } }
  .cell.letter:hover { border-color: var(--gold-bright); }
  .cell.letter.selected { background: linear-gradient(180deg, #33268a, #1c1150); border-color: var(--gold-bright); box-shadow: 0 0 12px rgba(244,204,106,0.5); }
  .cell.letter.active-word { border-color: var(--teal); }
  .cell.letter.solved { background: linear-gradient(180deg, #12513f, #0b3527); border-color: var(--teal); color: var(--teal); cursor: default; }
  .cell.letter.hint { background: linear-gradient(180deg, #2d2410, #1a1608); border-color: var(--gold); color: var(--gold); }
  .cell.letter.shake { animation: shake 0.35s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-4px);} 75%{transform:translateX(4px);} }

  .keyboard { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; max-width: 560px; }
  .key-btn {
    width: 32px; height: 36px;
    background: linear-gradient(180deg, rgba(42,26,85,0.9), rgba(23,11,52,0.9));
    border: 1.5px solid var(--gold-deep); border-radius: 8px;
    color: var(--gold-bright); font-family: var(--font-display); font-weight: 700; font-size: 14px;
    cursor: pointer; transition: transform 0.1s ease;
  }
  .key-btn:hover { transform: translateY(-2px); border-color: var(--gold-bright); }
  .key-btn.wide { width: 70px; color: var(--coral); border-color: var(--coral); font-family: var(--font-body); font-size: 11px; font-weight: 700; }

  .controls-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .ctrl-btn {
    background: transparent; border: 1.5px solid var(--gold-deep); color: var(--gold-bright);
    border-radius: 24px; padding: 10px 20px; font-weight: 700; font-size: 12.5px; cursor: pointer;
    font-family: var(--font-body); transition: all 0.15s ease;
  }
  .ctrl-btn:hover { background: rgba(244,204,106,0.1); border-color: var(--gold-bright); transform: translateY(-2px); }

  .win-overlay {
    position: fixed; inset: 0; background: rgba(5,3,15,0.85); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; z-index: 700; animation: fadeIn 0.4s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .win-card {
    background: linear-gradient(180deg, rgba(38,19,79,0.95), rgba(23,11,52,0.97));
    border: 2px solid var(--gold-deep); border-radius: 22px; padding: 40px 34px;
    text-align: center; max-width: 400px; width: 90%;
    box-shadow: 0 0 60px -10px rgba(244,204,106,0.4), 0 30px 70px rgba(0,0,0,0.6);
    animation: revealPop 0.5s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes revealPop { 0% { opacity:0; transform: scale(0.85) translateY(24px);} 60%{opacity:1; transform: scale(1.02) translateY(-4px);} 100%{opacity:1; transform: scale(1) translateY(0);} }
  .win-icon { font-size: 52px; margin-bottom: 8px; }
  .win-title { font-family: var(--font-display); font-size: 26px; color: var(--gold-bright); font-weight: 800; margin-bottom: 8px; }
  .win-stats { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; line-height: 1.7; }
  .win-stats b { color: var(--teal); font-family: var(--font-display); }

  .confetti-piece { position: fixed; top: -20px; z-index: 800; pointer-events: none; border-radius: 2px; animation: confettiFall linear forwards; }
  @keyframes confettiFall { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: 0.9; } }

  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="vignette"></div>

<div class="stage">
  <a class="back-link" href="index.html">← Arcade'e Dön</a>
  <div class="subtitle">İPUCU IZGARADA, KELİMEYİ SEN YERLEŞTİR</div>
  <div class="title">Çengel Bulmaca</div>

  <div class="hud-bar">
    <div class="hud-item"><span class="hud-label">Çözülen</span><span class="hud-value" id="solvedCount">0 / 0</span></div>
    <div class="hud-item"><span class="hud-label">Süre</span><span class="hud-value timer" id="timerText">00:00</span></div>
    <button class="hint-btn" id="hintBtn">💡 <span id="hintCount">3</span>/3</button>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="keyboard" id="keyboard"></div>

  <div class="controls-row">
    <button class="ctrl-btn" id="newPuzzleBtn">🔄 Yeni Bulmaca</button>
  </div>
</div>

<div class="win-overlay hidden" id="winOverlay">
  <div class="win-card">
    <div class="win-icon">🏆</div>
    <div class="win-title">Tebrikler!</div>
    <div class="win-stats">
      Bulmacayı <b id="winTime">00:00</b> sürede tamamladın.<br>
      Kullanılan ipucu: <b id="winHints">0</b>/3
    </div>
    <button class="ctrl-btn" id="winNewBtn" style="border-color: var(--gold-bright); padding: 12px 28px;">🔄 Yeni Bulmaca</button>
  </div>
</div>

<script>
const TR_ALPHABET = ['A','B','C','Ç','D','E','F','G','Ğ','H','I','İ','J','K','L','M','N','O','Ö','P','R','S','Ş','T','U','Ü','V','Y','Z'];

// Each puzzle: rows/cols bounding box, and a list of words with clue cell + start cell + direction.
const PUZZLES = [
  {
    rows: 9, cols: 9,
    words: [
      { dir: 'H', clueRow: 1, clueCol: 2, startRow: 1, startCol: 3, answer: 'KEDİ', clueText: 'Miyavlayan evcil hayvan' },
      { dir: 'V', clueRow: 0, clueCol: 4, startRow: 1, startCol: 4, answer: 'ELMA', clueText: 'Kırmızı ya da yeşil meyve' },
      { dir: 'H', clueRow: 4, clueCol: 3, startRow: 4, startCol: 4, answer: 'ARI',  clueText: 'Bal yapan çalışkan böcek' },
      { dir: 'V', clueRow: 3, clueCol: 6, startRow: 4, startCol: 6, answer: 'IŞIK', clueText: 'Karanlığın zıttı, aydınlık' },
      { dir: 'H', clueRow: 7, clueCol: 5, startRow: 7, startCol: 6, answer: 'KUŞ',  clueText: 'Gökyüzünde uçan tüylü hayvan' },
      { dir: 'H', clueRow: 2, clueCol: 3, startRow: 2, startCol: 4, answer: 'LALE', clueText: "Bahar çiçeği, İstanbul'un simgesi" },
      { dir: 'H', clueRow: 6, clueCol: 0, startRow: 6, startCol: 1, answer: 'OKUL', clueText: 'Öğrencilerin gittiği eğitim yeri' },
      { dir: 'V', clueRow: 5, clueCol: 2, startRow: 6, startCol: 2, answer: 'KUM',  clueText: 'Deniz kıyısındaki taneli madde' }
    ]
  },
  {
    rows: 9, cols: 8,
    words: [
      { dir: 'H', clueRow: 1, clueCol: 2, startRow: 1, startCol: 3, answer: 'MASA',  clueText: 'Üzerinde yemek yediğimiz mobilya' },
      { dir: 'V', clueRow: 0, clueCol: 5, startRow: 1, startCol: 5, answer: 'SAAT',  clueText: 'Zamanı gösteren araç' },
      { dir: 'H', clueRow: 4, clueCol: 3, startRow: 4, startCol: 4, answer: 'ATEŞ',  clueText: 'Yanan, sıcaklık veren şey' },
      { dir: 'V', clueRow: 3, clueCol: 7, startRow: 4, startCol: 7, answer: 'ŞEKER', clueText: 'Tatlı yapımında kullanılan beyaz madde' },
      { dir: 'V', clueRow: 3, clueCol: 6, startRow: 4, startCol: 6, answer: 'EKMEK', clueText: 'Buğdaydan yapılan temel besin' },
      { dir: 'H', clueRow: 6, clueCol: 0, startRow: 6, startCol: 1, answer: 'GÖZ',   clueText: 'Görmemizi sağlayan organ' }
    ]
  }
];

let currentPuzzleIdx = 0;
let grid = [];
let words = [];
let activeWordIdx = null;
let activeCell = null;
let hintsLeft = 3;
let solvedWords = 0;
let seconds = 0;
let timerInterval = null;
let gameStarted = false;
let gameWon = false;

const boardEl = document.getElementById('board');
const keyboardEl = document.getElementById('keyboard');
const solvedCountEl = document.getElementById('solvedCount');
const timerTextEl = document.getElementById('timerText');
const hintBtn = document.getElementById('hintBtn');
const hintCountEl = document.getElementById('hintCount');
const newPuzzleBtn = document.getElementById('newPuzzleBtn');
const winOverlay = document.getElementById('winOverlay');
const winNewBtn = document.getElementById('winNewBtn');

function buildGrid(puzzle) {
  const g = Array.from({ length: puzzle.rows }, () =>
    Array.from({ length: puzzle.cols }, () => ({ type: 'block' }))
  );
  puzzle.words.forEach((w, wIdx) => {
    g[w.clueRow][w.clueCol] = { type: 'clue', clueText: w.clueText, arrow: w.dir === 'H' ? '→' : '↓' };
    for (let i = 0; i < w.answer.length; i++) {
      const r = w.startRow + (w.dir === 'V' ? i : 0);
      const c = w.startCol + (w.dir === 'H' ? i : 0);
      const correctLetter = w.answer[i];
      if (g[r][c].type === 'letter') {
        g[r][c].wordIndices.push(wIdx);
      } else {
        g[r][c] = { type: 'letter', correctLetter, userLetter: '', wordIndices: [wIdx], solved: false, hint: false };
      }
    }
  });
  return g;
}

function loadPuzzle(idx) {
  currentPuzzleIdx = idx;
  const puzzle = PUZZLES[idx];
  words = puzzle.words;
  grid = buildGrid(puzzle);
  activeWordIdx = null;
  activeCell = null;
  hintsLeft = 3;
  solvedWords = 0;
  seconds = 0;
  gameStarted = false;
  gameWon = false;

  clearInterval(timerInterval);
  timerInterval = null;
  timerTextEl.textContent = '00:00';
  hintCountEl.textContent = hintsLeft;
  hintBtn.disabled = false;
  solvedCountEl.textContent = `0 / ${words.length}`;
  winOverlay.classList.add('hidden');

  renderBoard();
}

function startTimerIfNeeded() {
  if (gameStarted) return;
  gameStarted = true;
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    timerTextEl.textContent = `${m}:${s}`;
  }, 1000);
}

function renderBoard() {
  const puzzle = PUZZLES[currentPuzzleIdx];
  boardEl.innerHTML = '';
  boardEl.style.gridTemplateColumns = `repeat(${puzzle.cols}, 42px)`;
  for (let r = 0; r < puzzle.rows; r++) {
    for (let c = 0; c < puzzle.cols; c++) {
      const data = grid[r][c];
      const el = document.createElement('div');
      if (data.type === 'block') {
        el.className = 'cell block';
      } else if (data.type === 'clue') {
        el.className = 'cell clue';
        el.innerHTML = `<span>${data.clueText}</span><span class="arrow">${data.arrow}</span>`;
      } else {
        el.className = 'cell letter';
        if (data.solved) el.classList.add('solved');
        else if (data.hint) el.classList.add('hint');
        if (activeCell && activeCell.r === r && activeCell.c === c) el.classList.add('selected');
        else if (activeWordIdx !== null && data.wordIndices.includes(activeWordIdx)) el.classList.add('active-word');
        el.textContent = data.userLetter;
        el.addEventListener('click', () => selectCell(r, c));
      }
      boardEl.appendChild(el);
    }
  }
}

function selectCell(r, c) {
  if (gameWon) return;
  const cell = grid[r][c];
  if (cell.solved) return;
  if (activeCell && activeCell.r === r && activeCell.c === c && cell.wordIndices.length > 1) {
    const idx = cell.wordIndices.indexOf(activeWordIdx);
    activeWordIdx = cell.wordIndices[(idx + 1) % cell.wordIndices.length];
  } else {
    activeWordIdx = cell.wordIndices[0];
  }
  activeCell = { r, c };
  renderBoard();
}

function advanceActiveCell() {
  const w = words[activeWordIdx];
  let idx = w.dir === 'H' ? (activeCell.c - w.startCol) : (activeCell.r - w.startRow);
  idx++;
  if (idx >= w.answer.length) return;
  const r = w.startRow + (w.dir === 'V' ? idx : 0);
  const c = w.startCol + (w.dir === 'H' ? idx : 0);
  if (grid[r][c].solved) return;
  activeCell = { r, c };
}

function retreatActiveCell() {
  const w = words[activeWordIdx];
  let idx = w.dir === 'H' ? (activeCell.c - w.startCol) : (activeCell.r - w.startRow);
  idx--;
  if (idx < 0) return;
  const r = w.startRow + (w.dir === 'V' ? idx : 0);
  const c = w.startCol + (w.dir === 'H' ? idx : 0);
  activeCell = { r, c };
}

function typeLetter(letter) {
  if (!activeCell || gameWon) return;
  const cell = grid[activeCell.r][activeCell.c];
  if (cell.solved) return;
  cell.userLetter = letter;
  startTimerIfNeeded();
  checkWordsAtCell(activeCell.r, activeCell.c);
  advanceActiveCell();
  renderBoard();
}

function clearLetter() {
  if (!activeCell || gameWon) return;
  const cell = grid[activeCell.r][activeCell.c];
  if (cell.solved) return;
  if (cell.userLetter) {
    cell.userLetter = '';
  } else {
    retreatActiveCell();
  }
  renderBoard();
}

function checkWordsAtCell(r, c) {
  const wordIndices = grid[r][c].wordIndices;
  wordIndices.forEach(wIdx => {
    const w = words[wIdx];
    let filled = true;
    let correct = true;
    const cells = [];
    for (let i = 0; i < w.answer.length; i++) {
      const rr = w.startRow + (w.dir === 'V' ? i : 0);
      const cc = w.startCol + (w.dir === 'H' ? i : 0);
      const cell = grid[rr][cc];
      cells.push(cell);
      if (!cell.userLetter) filled = false;
      if (cell.userLetter !== w.answer[i]) correct = false;
    }
    if (filled && correct && !cells[0].solved) {
      cells.forEach(cell => {
        cell.solved = true;
        cell.hint = false;
      });
      solvedWords++;
      solvedCountEl.textContent = `${solvedWords} / ${words.length}`;
    }
  });
  checkPuzzleComplete();
}

function checkPuzzleComplete() {
  if (solvedWords === words.length) {
    gameWon = true;
    clearInterval(timerInterval);
    document.getElementById('winTime').textContent = timerTextEl.textContent;
    document.getElementById('winHints').textContent = 3 - hintsLeft;
    winOverlay.classList.remove('hidden');
    spawnConfetti();
  }
}

hintBtn.addEventListener('click', () => {
  if (hintsLeft <= 0 || gameWon) return;
  startTimerIfNeeded();
  const candidates = [];
  for (let r = 0; r < grid.length; r++) {
    for (let c = 0; c < grid[r].length; c++) {
      const cell = grid[r][c];
      if (cell.type === 'letter' && !cell.solved && cell.userLetter !== cell.correctLetter) {
        candidates.push({ r, c });
      }
    }
  }
  if (candidates.length === 0) return;
  const { r, c } = candidates[Math.floor(Math.random() * candidates.length)];
  const cell = grid[r][c];
  cell.userLetter = cell.correctLetter;
  cell.hint = true;
  hintsLeft--;
  hintCountEl.textContent = hintsLeft;
  hintBtn.disabled = hintsLeft <= 0;
  checkWordsAtCell(r, c);
  renderBoard();
});

function buildKeyboard() {
  keyboardEl.innerHTML = '';
  TR_ALPHABET.forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'key-btn';
    btn.textContent = letter;
    btn.addEventListener('click', () => typeLetter(letter));
    keyboardEl.appendChild(btn);
  });
  const del = document.createElement('button');
  del.className = 'key-btn wide';
  del.textContent = '⌫ Sil';
  del.addEventListener('click', clearLetter);
  keyboardEl.appendChild(del);
}

document.addEventListener('keydown', (e) => {
  if (gameWon || !activeCell) return;
  if (e.key === 'Backspace' || e.key === 'Delete') { clearLetter(); return; }
  const upper = e.key.toLocaleUpperCase('tr-TR');
  if (TR_ALPHABET.includes(upper)) typeLetter(upper);
});

newPuzzleBtn.addEventListener('click', () => {
  const nextIdx = PUZZLES.length > 1 ? (currentPuzzleIdx + 1) % PUZZLES.length : 0;
  loadPuzzle(nextIdx);
});
winNewBtn.addEventListener('click', () => {
  const nextIdx = PUZZLES.length > 1 ? (currentPuzzleIdx + 1) % PUZZLES.length : 0;
  loadPuzzle(nextIdx);
});

function spawnConfetti() {
  const colors = ['#f4cc6a', '#ffe29a', '#3fd8ae', '#ff9d9d', '#a99bd6', '#ffffff'];
  for (let i = 0; i < 90; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 6 + Math.random() * 8;
    piece.style.width = size + 'px';
    piece.style.height = size * 0.4 + 'px';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    const duration = 2.6 + Math.random() * 2;
    piece.style.animationDuration = duration + 's';
    piece.style.animationDelay = (Math.random() * 0.6) + 's';
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), (duration + 1) * 1000);
  }
}

buildKeyboard();
loadPuzzle(0);
</script>
